<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scale="gallery" data-mode="single">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEOMETOR Press — Compass-and-Straightedge Portrait Gallery</title>
  <style>
    :root {
      --bg: #080c12;
      --surface: #0f1621;
      --surface-2: #151f2e;
      --border: rgba(212, 175, 55, 0.24);
      --border-subtle: rgba(142, 157, 178, 0.18);
      --text: #eef2f7;
      --muted: #8e9db2;
      --gold: #d4af37;
      --chip-bg: rgba(212, 175, 55, 0.12);
    }

    html[data-theme="light"] {
      --bg: #fbf8f1;
      --surface: #f4efe3;
      --surface-2: #ebe4d4;
      --border: rgba(176, 127, 16, 0.30);
      --border-subtle: rgba(85, 97, 115, 0.18);
      --text: #181c24;
      --muted: #556173;
      --gold: #b07f10;
      --chip-bg: rgba(176, 127, 16, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 2.5rem;
    }

    header.topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem 1.5rem;
      padding-bottom: 1.15rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .title-block h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .title-block p {
      margin: 0.25rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
    }

    .segmented {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .segmented button,
    .toggle-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.38rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .segmented button.active,
    .toggle-btn.active {
      background: var(--chip-bg);
      color: var(--gold);
    }

    .toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.42rem 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.15rem;
    }

    html[data-scale="card"] .grid {
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    }

    html[data-scale="badge"] .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }

    html[data-mode="both"] .grid {
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .card-head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }

    .study-num {
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .medallion-pair {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .medallion-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      overflow: hidden;
    }

    .medallion-wrap img {
      display: block;
      width: 210px;
      height: auto;
      transition: width 0.18s ease;
    }

    html[data-mode="both"] .medallion-wrap img {
      width: 150px;
    }

    html[data-scale="card"] .medallion-wrap img {
      width: 116px;
    }

    html[data-scale="badge"] .medallion-wrap img {
      width: 48px;
    }

    .horizon-line {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 40.306%;
      height: 1px;
      border-top: 1px dashed var(--gold);
      opacity: 0.75;
      pointer-events: none;
    }

    html[data-horizon="on"] .horizon-line {
      display: block;
    }

    .card-meta {
      margin-top: 0.8rem;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .card-dates {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0.15rem 0 0.35rem;
    }

    .card-motif {
      font-size: 0.76rem;
      color: var(--gold);
      margin: 0;
    }

    html[data-scale="badge"] .card-motif {
      display: none;
    }

    dialog#inspector {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 1.35rem;
      max-width: 740px;
      width: calc(100vw - 2rem);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    dialog#inspector::backdrop {
      background: rgba(4, 7, 12, 0.75);
      backdrop-filter: blur(4px);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .modal-top h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .modal-top p {
      margin: 0.2rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .close-btn {
      appearance: none;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .modal-svgs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1rem 0;
    }

    .modal-pane {
      border-radius: 10px;
      padding: 0.75rem;
      text-align: center;
      border: 1px solid var(--border-subtle);
    }

    .modal-pane.dark-pane { background: #080c12; color: #eef2f7; }
    .modal-pane.light-pane { background: #fbf8f1; color: #181c24; }

    .modal-pane img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto 0.5rem;
    }

    .modal-pane a {
      color: var(--gold);
      font-size: 0.78rem;
      text-decoration: none;
    }

    .modal-details {
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.85rem;
    }

    .modal-details strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1>GEOMETOR Compass-and-Straightedge Portraits</h1>
        <p>Studies 01–07 · Strictly lines, circles, and circular arcs (0 Bézier curves) · Eye-line calibrated at y = −27</p>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Theme">
          <button type="button" data-set-mode="dark" class="active">Obsidian Ink</button>
          <button type="button" data-set-mode="light">Warm Paper</button>
          <button type="button" data-set-mode="both">Side-by-Side</button>
        </div>
        <div class="segmented" role="group" aria-label="Scale">
          <button type="button" data-set-scale="gallery" class="active">Gallery</button>
          <button type="button" data-set-scale="card">Card (116px)</button>
          <button type="button" data-set-scale="badge">Badge (48px)</button>
        </div>
        <button type="button" class="toggle-btn" id="horizon-toggle">Eye-Line (y = −27)</button>
      </div>
    </header>

    <main class="grid" id="gallery-grid"></main>
  </div>

  <dialog id="inspector">
    <div class="modal-top">
      <div>
        <h2 id="m-title"></h2>
        <p id="m-sub"></p>
      </div>
      <button type="button" class="close-btn" id="m-close">Close</button>
    </div>
    <div class="modal-svgs">
      <div class="modal-pane dark-pane">
        <img id="m-dark-img" alt="" />
        <a id="m-dark-link" target="_blank" rel="noopener">Open Dark SVG</a>
      </div>
      <div class="modal-pane light-pane">
        <img id="m-light-img" alt="" />
        <a id="m-light-link" target="_blank" rel="noopener">Open Light SVG</a>
      </div>
    </div>
    <div class="modal-details">
      <p><strong>Signature Motif:</strong> <span id="m-motif"></span></p>
      <p><strong>Reference Source:</strong> <span id="m-ref"></span></p>
    </div>
  </dialog>

  <script>
    const PORTRAITS = [
      {
        id: "durer",
        study: "Study 01",
        name: "Albrecht Dürer",
        dates: "1471 – 1528",
        era: "Renaissance",
        motif: "60° hair-cascade triangle & 1500 AD monogram",
        ref: "Self-Portrait at Twenty-Eight (1500), Alte Pinakothek, Munich"
      },
      {
        id: "euclid",
        study: "Study 02",
        name: "Euclid of Alexandria",
        dates: "fl. c. 300 BCE",
        era: "Antiquity",
        motif: "Elements I.1 Vesica Piscis & Equilateral Triangle ⟨A B C⟩",
        ref: "Urbino Baroque portrait holding Elements, J. Paul Getty Museum / Google Art Project"
      },
      {
        id: "plato",
        study: "Study 03",
        name: "Plato of Athens",
        dates: "c. 428 – c. 348 BCE",
        era: "Antiquity",
        motif: "Divided Line (Republic VI) & dodecahedral projection",
        ref: "Raphael, The School of Athens (1509–1511), Vatican"
      },
      {
        id: "aristotle",
        study: "Study 04",
        name: "Aristotle of Stagira",
        dates: "384 – 322 BCE",
        era: "Antiquity",
        motif: "Continuum axis & geometric syllogism triangle",
        ref: "Raphael, The School of Athens (1509–1511), Vatican"
      },
      {
        id: "pacioli",
        study: "Study 05",
        name: "Fra Luca Pacioli",
        dates: "c. 1447 – 1517",
        era: "Renaissance",
        motif: "Suspended glass rhombicuboctahedron & Golden Ratio dividers",
        ref: "Jacopo de' Barbari (1495), Museo di Capodimonte, Naples"
      },
      {
        id: "kepler",
        study: "Study 06",
        name: "Johannes Kepler",
        dates: "1571 – 1630",
        era: "Early Modern",
        motif: "Kepler Right Triangle (1 : √φ : φ) & nested Platonic orbits",
        ref: "Authentic Linz / Strasbourg oil portrait (c. 1620, JKepler.jpg)"
      },
      {
        id: "euler",
        study: "Study 07",
        name: "Leonhard Euler",
        dates: "1707 – 1783",
        era: "Enlightenment",
        motif: "Euler Line (O–G–H) & Nine-Point Circle",
        ref: "Jakob Emanuel Handmann pastel (1753), Kunstmuseum Basel"
      }
    ];

    function svgUrl(id, theme) {
      return `../portraits/${id}_${theme}.svg`;
    }

    function attachFallback(img, id, theme) {
      img.onerror = function () {
        if (!this.dataset.triedFallback) {
          this.dataset.triedFallback = "1";
          this.src = `../docsrc/_static/portraits/${id}_${theme}.svg`;
        }
      };
    }

    const grid = document.getElementById("gallery-grid");

    function renderGrid() {
      const mode = document.documentElement.dataset.mode;
      const theme = document.documentElement.dataset.theme;
      grid.innerHTML = "";

      for (const p of PORTRAITS) {
        const card = document.createElement("article");
        card.className = "card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `Inspect ${p.name}`);

        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = `<span class="study-num">${p.study}</span><span>${p.era}</span>`;
        card.appendChild(head);

        const pair = document.createElement("div");
        pair.className = "medallion-pair";

        const themesToShow = mode === "both" ? ["dark", "light"] : [theme];
        for (const t of themesToShow) {
          const wrap = document.createElement("div");
          wrap.className = "medallion-wrap";
          const img = document.createElement("img");
          img.src = svgUrl(p.id, t);
          img.alt = `${p.name} (${t})`;
          attachFallback(img, p.id, t);
          const horizon = document.createElement("div");
          horizon.className = "horizon-line";
          wrap.appendChild(img);
          wrap.appendChild(horizon);
          pair.appendChild(wrap);
        }
        card.appendChild(pair);

        const meta = document.createElement("div");
        meta.className = "card-meta";
        meta.innerHTML = `
          <h2 class="card-name">${p.name}</h2>
          <div class="card-dates">${p.dates}</div>
          <p class="card-motif">${p.motif}</p>
        `;
        card.appendChild(meta);

        card.addEventListener("click", () => openModal(p));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openModal(p);
          }
        });

        grid.appendChild(card);
      }
    }

    const modal = document.getElementById("inspector");
    function openModal(p) {
      document.getElementById("m-title").textContent = `${p.study} — ${p.name}`;
      document.getElementById("m-sub").textContent = `${p.dates} · ${p.era}`;
      document.getElementById("m-motif").textContent = p.motif;
      document.getElementById("m-ref").textContent = p.ref;

      const dImg = document.getElementById("m-dark-img");
      const lImg = document.getElementById("m-light-img");
      delete dImg.dataset.triedFallback;
      delete lImg.dataset.triedFallback;
      dImg.src = svgUrl(p.id, "dark");
      lImg.src = svgUrl(p.id, "light");
      attachFallback(dImg, p.id, "dark");
      attachFallback(lImg, p.id, "light");

      document.getElementById("m-dark-link").href = svgUrl(p.id, "dark");
      document.getElementById("m-light-link").href = svgUrl(p.id, "light");
      modal.showModal();
    }

    document.getElementById("m-close").addEventListener("click", () => modal.close());
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.close();
    });

    document.querySelectorAll("[data-set-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-set-mode]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const val = btn.dataset.setMode;
        if (val === "both") {
          document.documentElement.dataset.mode = "both";
        } else {
          document.documentElement.dataset.mode = "single";
          document.documentElement.dataset.theme = val;
        }
        renderGrid();
      });
    });

    document.querySelectorAll("[data-set-scale]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-set-scale]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.documentElement.dataset.scale = btn.dataset.setScale;
      });
    });

    const horizonBtn = document.getElementById("horizon-toggle");
    horizonBtn.addEventListener("click", () => {
      const active = document.documentElement.dataset.horizon === "on";
      document.documentElement.dataset.horizon = active ? "off" : "on";
      horizonBtn.classList.toggle("active", !active);
    });

    renderGrid();
  </script>
</body>
</html>
