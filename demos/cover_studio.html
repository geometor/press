<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOMETOR Press — Parametric Cover &amp; Spine System Studio</title>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #111216;
      --card: #181a20;
      --panel: #20232b;
      --fg: #ece6dc;
      --muted: #a69f93;
      --border: #2e323d;
      --primary: #d4a64a;
      --primary-fg: #14120e;
      --secondary: #282c36;
    }

    [data-theme="light"] {
      --bg: #f4efe6;
      --card: #fbf8f2;
      --panel: #eee8dc;
      --fg: #1b1917;
      --muted: #5f584e;
      --border: #d6cdbe;
      --primary: #8b3a3a;
      --primary-fg: #fbf8f2;
      --secondary: #e5decb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .serif-book {
      font-family: "EB Garamond", Garamond, "Palatino Linotype", Palatino, Georgia, serif;
    }

    .studio-shell {
      max-width: 1080px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    button {
      appearance: none;
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: var(--primary);
    }

    button.active {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
      font-weight: 600;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn.selected {
      background: var(--secondary);
      border-color: var(--primary);
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      padding: 0 6px;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: center;
      padding-top: 16px;
    }

    @media (min-width: 800px) {
      .stage-grid {
        grid-template-columns: 5.5fr 6.5fr;
      }
    }

    .specimen-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 0;
    }

    .book-shadow {
      border-radius: 3px;
      box-shadow:
        0 18px 38px -10px rgba(0, 0, 0, 0.5),
        0 4px 12px -2px rgba(0, 0, 0, 0.25);
    }

    .spine-interactive {
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .spine-interactive:hover {
      transform: translateY(-6px);
    }

    .meta-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meta-details {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .series-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .meta-title {
      margin: 2px 0 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--fg);
    }

    .meta-sub {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .shelf-wrap {
      padding-top: 16px;
      text-align: center;
    }

    .shelf-plank {
      display: inline-flex;
      align-items: flex-end;
      gap: 7px;
      padding: 14px 24px 8px;
      border-bottom: 5px solid var(--border);
      border-radius: 0 0 6px 6px;
      overflow-x: auto;
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <div class="topbar">
      <div class="btn-row">
        <button id="edition-parchment" onclick="setEdition('parchment')">Aldine Rag</button>
        <button id="edition-nocturnal" onclick="setEdition('nocturnal')">Nocturnal Foil</button>
        <button id="edition-cloth" onclick="setEdition('cloth')">Full-Cloth</button>
      </div>

      <div class="btn-row">
        <label class="check-label">
          <input id="toggle-grid" type="checkbox" onchange="toggleGrid(this.checked)" />
          <span><span class="serif-book" style="font-style:italic">φ</span> Canon Grid</span>
        </label>
        <button id="btn-view-cover" onclick="setView('cover')">Cover + Spine</button>
        <button id="btn-view-shelf" onclick="setView('shelf')">8-Book Shelf</button>
        <button onclick="downloadActiveSVG()" title="Download Front Cover SVG">↓ Export SVG</button>
        <button id="btn-theme" onclick="toggleTheme()" title="Toggle Studio Light/Dark">◐ Theme</button>
      </div>
    </div>

    <!-- Cover + Spine Stage -->
    <div id="stage-cover" class="stage-grid">
      <div class="specimen-wrap" id="specimen-mount"></div>

      <div class="meta-panel">
        <div class="btn-row" id="book-pills"></div>
        <div class="meta-details">
          <div id="spec-series-badge" class="series-badge"></div>
          <h2 id="spec-title" class="meta-title serif-book"></h2>
          <p id="spec-author" class="meta-sub" style="font-weight:600"></p>
          <p id="spec-diagram" class="meta-sub"></p>
          <p id="spec-apparatus" class="meta-sub"></p>
        </div>
      </div>
    </div>

    <!-- Shelf Lineup Stage -->
    <div id="stage-shelf" class="shelf-wrap hidden">
      <p class="meta-sub" style="margin-bottom:12px">
        Click any spine to inspect its front cover. All five series share aligned medallion and Vesica colophon datums.
      </p>
      <div id="shelf-mount"></div>
    </div>
  </div>

  <script>
    const SERIES = {

        pigment: "#6B53B0",
        clothBg: "#49377D",
        foilOnDark: "#B09BF0"
      }
    };

    const BOOKS = [
      {
        id: "hoenen",
        pill: "Hoenen",
        series: "noetica",
        titleLines: ["DE NOETICA", "GEOMETRIAE"],
        subtitle: "The Noetics of Geometry (1954)",
        author: "PETRUS HOENEN, S.J.",
        spineTitle: "HOENEN · DE NOETICA GEOMETRIAE",
        badge: "LATIN · ENGLISH CRITICAL EDITION",
        pages: 380,
        spineWidth: 50,
        icon: "gnomon",
        diagramDesc: "Nested golden whirling squares and inscribed right triangle over the intelligible continuum.",
        apparatus: "1954 Gregorian Latin & complete English translation · 412 citations · 83 persons · 99 terms.",
        draw: (c) => `
          <g transform="translate(200, 350)">
            <circle cx="0" cy="0" r="108" fill="none" stroke="${c.aux}" stroke-width="1" stroke-dasharray="3 3"/>
            <rect x="-88" y="-54.4" width="176" height="108.8" fill="none" stroke="${c.ink}" stroke-width="1.4"/>
            <line x1="20.8" y1="-54.4" x2="20.8" y2="54.4" stroke="${c.ink}" stroke-width="1.1"/>

            <line x1="46.5" y1="12.8" x2="46.5" y2="54.4" stroke="${c.ink}" stroke-width="1"/>
            <polygon points="-88,54.4 20.8,-54.4 20.8,54.4" fill="${c.accentFill}" stroke="${c.accent}" stroke-width="2.2"/>
            <path d="M -88 54.4 A 108.8 108.8 0 0 1 20.8 -54.4 A 67.2 67.2 0 0 1 88 12.8 A 41.6 41.6 0 0 1 46.5 54.4 A 25.7 25.7 0 0 1 20.8 28.7" fill="none" stroke="${c.accent}" stroke-width="1.8"/>
            <circle cx="-88" cy="54.4" r="3" fill="${c.ink}"/>
            <circle cx="20.8" cy="-54.4" r="3" fill="${c.accent}"/>

      },
      {
        id: "euclid",
        pill: "Euclid",
        series: "fontes",
        titleLines: ["THE ELEMENTS", "OF EUCLID"],
        subtitle: "Books I–XIII · Translated by Sir Thomas L. Heath",
        author: "EUCLID OF ALEXANDRIA",
        spineTitle: "EUCLID · THE THIRTEEN BOOKS OF ELEMENTS",
        badge: "1,438 FOLIOS · 831 CALIBRATED FIGURES",
        pages: 620,
        spineWidth: 68,
        icon: "vesica",
        diagramDesc: "Book I Prop. 1 & George Odom's Unfolding: Vesica Piscis, equilateral frame, and circumcircle cutting [AB] in φ.",
        apparatus: "2-Track Critical Codex synchronized to Heiberg folios & 601-node computable G-Index.",
        draw: (c) => `
          <g transform="translate(200, 352)">
            <circle cx="0" cy="-18" r="106" fill="none" stroke="${c.ink}" stroke-width="1.35"/>
            <circle cx="-44" cy="14" r="88" fill="none" stroke="${c.aux}" stroke-width="1.15"/>
            <circle cx="44" cy="14" r="88" fill="none" stroke="${c.aux}" stroke-width="1.15"/>

            <circle cx="44" cy="14" r="3.4" fill="${c.ink}"/>
            <circle cx="0" cy="-62.2" r="3.4" fill="${c.accent}"/>
            <circle cx="98.4" cy="14" r="4" fill="${c.accent}"/>

      {
        id: "pacioli",
        pill: "Pacioli",
        series: "fontes",
        titleLines: ["DE DIVINA", "PROPORTIONE"],
        subtitle: "With the Sixty Polyhedra of Leonardo da Vinci",
        author: "FRA LUCA PACIOLI",
        spineTitle: "PACIOLI · DE DIVINA PROPORTIONE (1509)",
        badge: "5-TRACK CODEX · VENICE 1509 / VIENNA 1889",
        pages: 480,
        spineWidth: 58,
        icon: "poly",
        diagramDesc: "Orthographic projection of the regular Dodecahedron & Golden Icosahedral skeleton.",

        draw: (c) => {
          const ptsOuter = Array.from({ length: 10 }, (_, i) => {
            const a = -Math.PI / 2 + (i * Math.PI) / 5;
            return [102 * Math.cos(a), 102 * Math.sin(a)];
          });
          const ptsInner = Array.from({ length: 10 }, (_, i) => {
            const a = -Math.PI / 2 + (i * Math.PI) / 5;
            const r = i % 2 === 0 ? 63 : 39;
            return [r * Math.cos(a), r * Math.sin(a)];
          });
          const polyOuter = ptsOuter.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");
          let spokes = "";
          for (let i = 0; i < 10; i++) {
            const n = (i + 1) % 10;
            spokes += `<line x1="${ptsOuter[i][0].toFixed(1)}" y1="${ptsOuter[i][1].toFixed(1)}" x2="${ptsInner[i][0].toFixed(1)}" y2="${ptsInner[i][1].toFixed(1)}" stroke="${c.ink}" stroke-width="1.25"/>`;
            spokes += `<line x1="${ptsInner[i][0].toFixed(1)}" y1="${ptsInner[i][1].toFixed(1)}" x2="${ptsInner[n][0].toFixed(1)}" y2="${ptsInner[n][1].toFixed(1)}" stroke="${c.accent}" stroke-width="1.8"/>`;
          }
          const pent = [0, 2, 4, 6, 8].map((i) => ptsInner[i].map((v) => v.toFixed(1)).join(",")).join(" ");
          return `
            <g transform="translate(200, 350)">
              <circle cx="0" cy="0" r="102" fill="none" stroke="${c.aux}" stroke-width="1" stroke-dasharray="3 3"/>

              <polygon points="${pent}" fill="${c.accentFill}" stroke="${c.accent}" stroke-width="2"/>

        }
      },
      {
        id: "divine",
        pill: "Divine",
        series: "synthesis",
        titleLines: ["DIVINE", "CONSTRUCTIONS"],
        subtitle: "Forty-Five Exact Pathways to the Golden Ratio",
        author: "GEOMETOR COMPENDIUM",
        spineTitle: "DIVINE CONSTRUCTIONS · 45 PATHWAYS TO PHI",
        badge: "EXACT Q(√5) ALGEBRA · LEMOINE METRICS",
        pages: 260,
        spineWidth: 42,
        icon: "pentagram",
        diagramDesc: "Regular Pentagon, Pentagram & Golden Gnomon certifying quadrance ratio Q_long = (φ + 1) Q_short.",
        apparatus: "45 certified constructions across 7 families + 52-Card Golden Collector Deck.",
        draw: (c) => {
          const R = 104;
          const p = Array.from({ length: 5 }, (_, i) => {
            const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
            return [R * Math.cos(a), R * Math.sin(a)];
          });
          const pent = p.map((pt) => pt.map((v) => v.toFixed(1)).join(",")).join(" ");
          const starOrder = [0, 2, 4, 1, 3, 0];
          const starPath = "M " + starOrder.map((idx) => p[idx].map((v) => v.toFixed(1)).join(" ")).join(" L ");
          return `
            <g transform="translate(200, 350)">
              <circle cx="0" cy="0" r="${R}" fill="none" stroke="${c.ink}" stroke-width="1.35"/>
              <circle cx="0" cy="0" r="39.7" fill="none" stroke="${c.aux}" stroke-width="1" stroke-dasharray="3 3"/>
              <polygon points="${pent}" fill="none" stroke="${c.ink}" stroke-width="1.5"/>
              <polygon points="${p[0][0].toFixed(1)},${p[0][1].toFixed(1)} ${p[2][0].toFixed(1)},${p[2][1].toFixed(1)} ${p[3][0].toFixed(1)},${p[3][1].toFixed(1)}" fill="${c.accentFill}" stroke="none"/>
              <path d="${starPath}" fill="none" stroke="${c.accent}" stroke-width="2"/>
              ${p.map((pt) => `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.2" fill="${c.accent}"/>`).join("")}
            </g>`;
        }
      },
      {
        id: "etc",
        pill: "ETC",
        series: "synthesis",
        titleLines: ["TRIANGLE", "CENTERS"],
        subtitle: "Selected Atlas from Kimberling's Encyclopedia",
        author: "CLARK KIMBERLING · GEOMETOR",
        spineTitle: "KIMBERLING · ATLAS OF TRIANGLE CENTERS",
        badge: "FOUR CANONICAL TRIANGLES · EULER & FEUERBACH",
        pages: 540,
        spineWidth: 62,
        icon: "triangle",
        diagramDesc: "Feuerbach's Theorem & Euler Line: Incircle (X₁), Circumcircle (X₃), and Nine-Point Circle (X₅) kissing at X₁₁.",
        apparatus: "Selected print atlas from 4,000+ compiled symbolic centers & 69,500+ SVGs + Classic 54 Deck.",
        draw: (c) => `
          <g transform="translate(200, 354)">
            <circle cx="0" cy="-4" r="98" fill="none" stroke="${c.aux}" stroke-width="1.15"/>

            <line x1="-38" y1="-62" x2="28" y2="26" stroke="${c.accent}" stroke-width="1.5" stroke-dasharray="4 2"/>
            <circle cx="-4" cy="11" r="3" fill="${c.ink}"/>
            <circle cx="-7" cy="-18" r="3.2" fill="${c.accent}"/>
            <circle cx="-2" cy="-33" r="4.2" fill="${c.accent}"/>
          </g>`
      },
      {
        id: "plato",
        pill: "Plato",
        series: "noetica",
        titleLines: ["LOCI MATHEMATICI", "ET GEOMETRICI"],
        subtitle: "Meno · Theaetetus · Republic · Timaeus",
        author: "PLATO OF ATHENS",
        spineTitle: "PLATO · LOCI MATHEMATICI ET GEOMETRICI",
        badge: "BURNET GREEK OCT · JOWETT ENGLISH",
        pages: 340,
        spineWidth: 46,
        icon: "spiral",
        diagramDesc: "The Spiral of Theodorus (Theaetetus 147d): compass-and-straightedge surd tower Q = 1..14.",
        apparatus: "4-Track Greek/English Codex anchoring 58 cross-corpus loci + playable 34-pitch Timaeus scale.",
        draw: (c) => {
          const scale = 23.5;
          let x = scale, y = 0, tris = "";
          for (let n = 1; n <= 14; n++) {
            const len = Math.hypot(x, y);
            const nx = x - (y / len) * scale;
            const ny = y + (x / len) * scale;
            const isHi = n === 1 || n === 2 || n === 3 || n === 5;
            tris += `<polygon points="0,0 ${x.toFixed(1)},${y.toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)}" fill="${isHi ? c.accentFill : "none"}" stroke="${isHi ? c.accent : c.ink}" stroke-width="${isHi ? 1.8 : 1.05}"/>`;
            x = nx;
            y = ny;
          }
          return `<g transform="translate(212, 355)">${tris}<circle cx="0" cy="0" r="3.2" fill="${c.accent}"/></g>`;
        }
      },
      {
        id: "thompson",
        pill: "Thompson",
        series: "natura",

        author: "D'ARCY WENTWORTH THOMPSON",
        spineTitle: "THOMPSON · ON GROWTH AND FORM",
        badge: "1917 CAMBRIDGE EDITION · HAMBIDGE CONCORDANCE",
        pages: 510,
        spineWidth: 60,
        icon: "shell",
        diagramDesc: "Equiangular logarithmic gnomon & conformal coordinate mesh governing shell chambers and biological growth.",

        draw: (c) => {
          let rings = "", rays = "", pts = [];
          for (let i = 1; i <= 6; i++) rings += `<circle cx="0" cy="0" r="${i * 16.5}" fill="none" stroke="${c.aux}" stroke-width="0.9" stroke-dasharray="2 3"/>`;
          for (let i = 0; i < 12; i++) {
            const a = (i * Math.PI) / 6;
            rays += `<line x1="0" y1="0" x2="${(102 * Math.cos(a)).toFixed(1)}" y2="${(102 * Math.sin(a)).toFixed(1)}" stroke="${c.aux}" stroke-width="0.85"/>`;

            const ang = t * 0.22, r = 4.2 * Math.exp(0.255 * ang);
            if (r <= 104) pts.push(`${(r * Math.cos(ang)).toFixed(1)} ${(r * Math.sin(ang)).toFixed(1)}`);

          return `
            <g transform="translate(200, 352)">

              <circle cx="0" cy="0" r="3" fill="${c.accent}"/>
            </g>`;
        }
      },
      {
        id: "codes",
        pill: "Codes",
        series: "instrumenta",
        titleLines: ["GEOMETOR", "CODES"],
        subtitle: "Eleven Formal & Visual Languages of Geometry",
        author: "GEOMETOR MONOGRAPH",
        spineTitle: "GEOMETOR CODES · FORMAL LANGUAGES",
        badge: "ROSETTA STONE · LEAN4 · GEOCOQ · BYRNE · SYMPY",
        pages: 290,
        spineWidth: 44,
        icon: "dag",
        diagramDesc: "Circle Power, Polarity & Inversion Rosetta configuration uniting synthetic, Clifford CGA, and ANP algebra.",
        apparatus: "69-topic × 11-system comparative matrix across theorem provers and visual pseudocodes.",
        draw: (c) => `
          <g transform="translate(200, 352)">
            <circle cx="-18" cy="0" r="74" fill="${c.accentFill}" stroke="${c.ink}" stroke-width="1.6"/>
            <line x1="-112" y1="0" x2="112" y2="0" stroke="${c.aux}" stroke-width="1" stroke-dasharray="3 3"/>
            <line x1="18" y1="-96" x2="18" y2="96" stroke="${c.accent}" stroke-width="2"/>
            <line x1="96" y1="0" x2="18" y2="-64.8" stroke="${c.ink}" stroke-width="1.35"/>
            <line x1="96" y1="0" x2="18" y2="64.8" stroke="${c.ink}" stroke-width="1.35"/>
            <line x1="-18" y1="0" x2="18" y2="-64.8" stroke="${c.aux}" stroke-width="1.1"/>
            <line x1="-18" y1="0" x2="18" y2="64.8" stroke="${c.aux}" stroke-width="1.1"/>
            <circle cx="-18" cy="0" r="3.2" fill="${c.ink}"/>
            <circle cx="18" cy="0" r="3.4" fill="${c.accent}"/>
            <circle cx="96" cy="0" r="3.8" fill="${c.accent}"/>
          </g>`
      }
    ];

    let state = { view: "cover", edition: "nocturnal", selectedId: "hoenen", showGrid: false, theme: "dark" };

    function getPalette(book) {
      const s = SERIES[book.series];
      if (state.edition === "parchment") {
        return {
          coverBg: "#F4EFE6", spineBg: s.pigment, spineText: "#FAF6EE", spineRule: "rgba(255,255,255,0.55)",
          frame: "#2A2723", frameSub: "rgba(42,39,35,0.45)", title: "#181614", subtitle: "#4A453E",
          rubric: s.pigment, ink: "#1E1C1A", aux: "rgba(30,28,26,0.36)", accent: s.pigment,
          accentFill: s.pigment + "22", colophon: "#2A2723"
        };
      }
      if (state.edition === "nocturnal") {
        return {
          coverBg: "#17171A", spineBg: "#1E1E22", spineText: "#E6DFD3", spineRule: s.foilOnDark,
          frame: "#C8A24E", frameSub: "rgba(200,162,78,0.42)", title: "#EDE6DA", subtitle: "#B5ACA0",
          rubric: s.foilOnDark, ink: "#D8BA6C", aux: "rgba(216,186,108,0.34)", accent: s.foilOnDark,
          accentFill: s.foilOnDark + "1F", colophon: "#D8BA6C"
        };
      }
      return {
        coverBg: s.clothBg, spineBg: s.clothBg, spineText: "#F5EFE4", spineRule: "#E8C97A",
        frame: "#E8C97A", frameSub: "rgba(232,201,122,0.45)", title: "#FAF5EC", subtitle: "#EAE0CE",
        rubric: "#F2D68B", ink: "#F5EFE4", aux: "rgba(245,239,228,0.38)", accent: "#F2D68B",
        accentFill: "rgba(242,214,139,0.16)", colophon: "#F2D68B"
      };
    }

    function spineGlyphSVG(icon, stroke) {
      switch (icon) {
        case "vesica": return `<circle cx="-5" cy="0" r="8" fill="none" stroke="${stroke}" stroke-width="1.2"/><circle cx="5" cy="0" r="8" fill="none" stroke="${stroke}" stroke-width="1.2"/>`;
        case "gnomon": return `<rect x="-9" y="-6" width="18" height="12" fill="none" stroke="${stroke}" stroke-width="1.2"/><line x1="-9" y1="6" x2="3" y2="-6" stroke="${stroke}" stroke-width="1.3"/>`;
        case "poly": return `<polygon points="0,-10 9,-3 6,8 -6,8 -9,-3" fill="none" stroke="${stroke}" stroke-width="1.2"/><polygon points="0,-5 5,3 -5,3" fill="none" stroke="${stroke}" stroke-width="1"/>`;
        case "pentagram": return `<circle cx="0" cy="0" r="9.5" fill="none" stroke="${stroke}" stroke-width="1.1"/><polygon points="0,-9 5.5,7.5 -9,-2.8 9,-2.8 -5.5,7.5" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
        case "triangle": return `<polygon points="0,-9.5 9.5,7.5 -9.5,7.5" fill="none" stroke="${stroke}" stroke-width="1.2"/><circle cx="0" cy="1.8" r="4.8" fill="none" stroke="${stroke}" stroke-width="1.1"/>`;
        case "spiral": return `<circle cx="0" cy="0" r="9" fill="none" stroke="${stroke}" stroke-width="1.1"/><path d="M 0 0 L 7 0 L 5 -6 L -3 -7 L -8 1" fill="none" stroke="${stroke}" stroke-width="1.2"/>`;
        case "shell": return `<circle cx="0" cy="0" r="9" fill="none" stroke="${stroke}" stroke-width="1.1"/><path d="M 0 0 Q 4 -3 3 -6 Q -3 -8 -6 -2 Q -8 6 2 8" fill="none" stroke="${stroke}" stroke-width="1.2"/>`;
        default: return `<circle cx="-2" cy="0" r="7.5" fill="none" stroke="${stroke}" stroke-width="1.2"/><line x1="3" y1="-9" x2="3" y2="9" stroke="${stroke}" stroke-width="1.2"/>`;
      }
    }

    function colophonMark(cx, cy, r, stroke) {
      const dx = r * 0.5;
      return `<g transform="translate(${cx}, ${cy})">
        <circle cx="${-dx}" cy="0" r="${r}" fill="none" stroke="${stroke}" stroke-width="1.2"/>
        <circle cx="${dx}" cy="0" r="${r}" fill="none" stroke="${stroke}" stroke-width="1.2"/>
        <polygon points="${-dx},0 ${dx},0 0,${(-r * 0.866).toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="1"/>
      </g>`;
    }

    function renderSpineSVG(book, displayH = 420, interactive = false) {
      const p = getPalette(book);
      const s = SERIES[book.series];
      const w = book.spineWidth, h = 600;
      const dispW = Math.round(w * (displayH / h));
      const isSelected = interactive && book.id === state.selectedId;
      const topBand = state.edition === "nocturnal"
        ? `<rect x="0" y="0" width="${w}" height="12" fill="${s.pigment}"/><rect x="0" y="${h - 12}" width="${w}" height="12" fill="${s.pigment}"/>` : "";
      const guides = state.showGrid
        ? `<line x1="0" y1="86" x2="${w}" y2="86" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="0" y1="${h - 92}" x2="${w}" y2="${h - 92}" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 3"/>` : "";

      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="${dispW}" height="${displayH}" viewBox="0 0 ${w} ${h}"
          class="book-shadow ${interactive ? "spine-interactive" : ""}"
          style="${isSelected ? "outline: 2px solid var(--primary); outline-offset: 3px;" : ""}"
          ${interactive ? `onclick="selectBook('${book.id}')"` : ""}>
          <rect x="0" y="0" width="${w}" height="${h}" fill="${p.spineBg}"/>
          ${topBand}
          <rect x="0" y="0" width="6" height="${h}" fill="rgba(255,255,255,0.08)"/>
          <g transform="translate(${w / 2}, 52)">${spineGlyphSVG(book.icon, p.spineRule)}</g>
          <line x1="8" y1="86" x2="${w - 8}" y2="86" stroke="${p.spineRule}" stroke-width="1.1"/>
          <g transform="translate(${w / 2}, ${h / 2 - 6}) rotate(90)">
            <text x="0" y="4" text-anchor="middle" fill="${p.spineText}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="13" letter-spacing="1.6">${book.spineTitle}</text>
          </g>
          <line x1="8" y1="${h - 92}" x2="${w - 8}" y2="${h - 92}" stroke="${p.spineRule}" stroke-width="1.1"/>
          ${colophonMark(w / 2, h - 60, 8.5, p.spineRule)}
          <text x="${w / 2}" y="${h - 28}" text-anchor="middle" fill="${p.spineText}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="7.5" letter-spacing="1.2">GEOMETOR</text>
          ${guides}
        </svg>`;
    }

    function buildCoverSVGString(book, dispW = 280, dispH = 420) {
      const p = getPalette(book), s = SERIES[book.series];
      const W = 400, H = 600;
      const phiHorizon = Math.round(H * 0.382), phiLower = Math.round(H * 0.618);
      const titleSVG = `<text x="200" y="114" text-anchor="middle" fill="${p.title}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="29" letter-spacing="2.3">${book.titleLines[0]}</text>
                        <text x="200" y="148" text-anchor="middle" fill="${p.title}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="29" letter-spacing="2.3">${book.titleLines[1]}</text>`;
      const gridOverlay = state.showGrid ? `
        <g pointer-events="none">
          <rect x="44" y="44" width="312" height="512" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4 3"/>
          <line x1="0" y1="${phiHorizon}" x2="${W}" y2="${phiHorizon}" stroke="#00E5FF" stroke-width="1.4" stroke-dasharray="5 3"/>
          <line x1="0" y1="${phiLower}" x2="${W}" y2="${phiLower}" stroke="#FF52A8" stroke-width="1.4" stroke-dasharray="5 3"/>
          <line x1="0" y1="${H - 92}" x2="${W}" y2="${H - 92}" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="3 3"/>
        </g>` : "";

      return `<svg id="active-cover-svg" xmlns="http://www.w3.org/2000/svg" width="${dispW}" height="${dispH}" viewBox="0 0 ${W} ${H}" class="book-shadow">
        <rect x="0" y="0" width="${W}" height="${H}" fill="${p.coverBg}"/>
        <rect x="0" y="0" width="12" height="${H}" fill="rgba(0,0,0,0.16)"/>
        <rect x="24" y="24" width="${W - 48}" height="${H - 48}" fill="none" stroke="${p.frame}" stroke-width="1.3"/>
        <rect x="29" y="29" width="${W - 58}" height="${H - 58}" fill="none" stroke="${p.frameSub}" stroke-width="0.8"/>
        <text x="200" y="62" text-anchor="middle" fill="${p.rubric}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="11" letter-spacing="2.6" font-weight="600">${s.code}</text>
        <line x1="135" y1="73" x2="265" y2="73" stroke="${p.frameSub}" stroke-width="0.8"/>
        ${titleSVG}
        <text x="200" y="175" text-anchor="middle" fill="${p.subtitle}" font-family="EB Garamond, Garamond, Georgia, serif" font-style="italic" font-size="14.5">${book.subtitle}</text>
        <text x="200" y="206" text-anchor="middle" fill="${p.title}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="12" letter-spacing="2.4">${book.author}</text>
        ${book.draw(p)}
        ${colophonMark(200, H - 78, 10.5, p.colophon)}
        <text x="200" y="${H - 50}" text-anchor="middle" fill="${p.title}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="11.5" letter-spacing="3">GEOMETOR PRESS</text>
        <text x="200" y="${H - 36}" text-anchor="middle" fill="${p.subtitle}" font-family="EB Garamond, Garamond, Georgia, serif" font-size="8.5" letter-spacing="1.7">${book.badge}</text>
        ${gridOverlay}
      </svg>`;
    }

    function renderCoverSpecimen(book) {
      return `${renderSpineSVG(book, 420, false)}${buildCoverSVGString(book, 280, 420)}`;
    }

    function renderUI() {
      const book = BOOKS.find((b) => b.id === state.selectedId) || BOOKS[0];
      const s = SERIES[book.series];

      ["cover", "shelf"].forEach((v) => {
        document.getElementById("btn-view-" + v).classList.toggle("active", state.view === v);
      });

      ["parchment", "nocturnal", "cloth"].forEach((ed) => {
        document.getElementById("edition-" + ed).classList.toggle("active", state.edition === ed);
      });

      document.getElementById("book-pills").innerHTML = BOOKS.map((b) => {
        const bs = SERIES[b.series];
        const active = b.id === state.selectedId;
        return `<button onclick="selectBook('${b.id}')" class="pill-btn ${active ? "selected" : ""}">
          <span class="dot" style="background:${bs.pigment}"></span>
          <span>${b.pill}</span>
        </button>`;
      }).join("");

      document.getElementById("stage-cover").classList.toggle("hidden", state.view !== "cover");
      document.getElementById("stage-shelf").classList.toggle("hidden", state.view !== "shelf");

      if (state.view === "cover") {
        document.getElementById("specimen-mount").innerHTML = renderCoverSpecimen(book);
        const badge = document.getElementById("spec-series-badge");
        badge.textContent = s.code;
        badge.style.backgroundColor = s.pigment + "26";
        badge.style.color = s.pigment;
        badge.style.border = `1px solid ${s.pigment}66`;
        document.getElementById("spec-title").textContent = book.titleLines.join(" ") + " — " + book.subtitle;
        document.getElementById("spec-author").textContent = `${book.author} · Est. ${book.pages} pp.`;
        document.getElementById("spec-diagram").textContent = book.diagramDesc;
        document.getElementById("spec-apparatus").textContent = book.apparatus;
      } else {
        document.getElementById("shelf-mount").innerHTML = `
          <div class="shelf-plank">
            ${BOOKS.map((b) => renderSpineSVG(b, 400, true)).join("")}
          </div>`;
      }
    }

    function downloadActiveSVG() {
      const book = BOOKS.find((b) => b.id === state.selectedId) || BOOKS[0];
      const svgMarkup = buildCoverSVGString(book, 800, 1200);
      const blob = new Blob([svgMarkup], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `geometor-press-${book.id}-${state.edition}.svg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
    }

    function setView(v) { state.view = v; renderUI(); }
    function setEdition(ed) { state.edition = ed; renderUI(); }
    function selectBook(id) { state.selectedId = id; state.view = "cover"; renderUI(); }
    function toggleGrid(val) { state.showGrid = val; renderUI(); }

    renderUI();
  </script>
</body>
</html>
