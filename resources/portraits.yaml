specification:
  name: "GEOMETOR Compass-and-Straightedge Medallion"
  viewBox: "-102 -106 204 196"
  medallion_center: [0.0, -8.0]
  medallion_radius: 92.0
  outer_rim_radius: 95.2
  canonical_eye_line_y: -27.0
  canonical_head_radius: 26.0
  primitives_allowed: ["line", "circle", "arc (M ... A ...)"]
  primitives_forbidden: ["C", "Q", "S", "T", "ellipse", "polygon", "polyline"]
  layers:
    scaffold:
      dark_stroke: "#4a5d76"
      light_stroke: "#9aa6b8"
      stroke_width: 0.44
      opacity: 0.45
      role: "Medallion ring, symmetry axes, cranial circle R, golden circle R*phi, Vesica eye circles"
    golden:
      dark_stroke: "#d4af37"
      light_stroke: "#b07f10"
      stroke_width: 0.85
      opacity: 0.92
      role: "Subject signature geometric motif, dividers, polyhedron, or monogram"
    detail:
      dark_stroke: "#8e9db2"
      light_stroke: "#556173"
      stroke_width: 0.62
      opacity: 0.84
      role: "Upper lid fold, delicate lower lid, iris ring, Euclid III.12 interior curl/drapery folds"
    primary:
      dark_stroke: "#eef2f7"
      light_stroke: "#181c24"
      stroke_width: 1.15
      opacity: 1.0
      role: "Connected cranial/cheek/jaw contours, brows, upper lash, filled pupil, nose, lips, collar"
