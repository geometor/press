      - edition: algebra_cubic_conics
        title: "Treatise on Demonstration of Problems of Algebra (Cubic-Conic Intersections)"
        year: 1931
        editor: "Daoud S. Kasir ( Columbia University ) / Franz Woepcke (1851)"
      - edition: parallel_postulate
        title: "Commentaries on the Difficulties in the Postulates of Euclid's Elements"
        year: 1851

  - repo: al-kashi
    author: Jamshid al-Kashi
    dates: "c. 1380–1429 CE"
    era: Islamic Golden Age
    priority: 2
