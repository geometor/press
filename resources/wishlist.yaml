# GEOMETOR Digital Scriptorium — Master Public-Domain Library Acquisition Wishlist
# Each author maps to a standalone repository initialized via:
#   clerk init <repo_slug> --type codex --org geometor --edition <edition_slug> --title "<Book Title>" --book-author "<Full Author Name>"
# Followed by archival PDF placement in resources/<edition_slug>/pdfs/ and:
#   publish folio-ingest --repo /home/phi/PROJECTS/geometor/<repo_slug> --edition <edition_slug>

wishlist:
  # I. Historiography & Master Spine
  - repo: heath
    author: Sir Thomas Little Heath
    dates: "1861–1940"
    era: Historiography & Master Spine
    priority: 1
    books:
      - edition: greek_mathematics_vol1
        title: "A History of Greek Mathematics, Vol. I: From Thales to Euclid"
        year: 1921
        publisher: "Oxford: Clarendon Press"
      - edition: greek_mathematics_vol2
        title: "A History of Greek Mathematics, Vol. II: From Aristarchus to Diophantus"
        year: 1921
        publisher: "Oxford: Clarendon Press"

  # II. Classical & Late Antiquity
  - repo: iamblichus
    author: Iamblichus of Chalcis
    dates: "c. 245–325 CE"
    era: Classical & Late Antiquity
    priority: 1
    books:
      - edition: in_nicomachi_arithmeticam
        title: "In Nicomachi Arithmeticam Introductionem"
        year: 1894
        editor: "Hermenegildus Pistelli (Teubner) / Thomas Taylor (1818)"
      - edition: de_communi_mathematica
        title: "De Communi Mathematica Scientia"
        year: 1891
        editor: "Nicola Festa (Teubner)"
      - edition: de_vita_pythagorica
        title: "On the Pythagorean Life & Theologoumena Arithmeticae"
        year: 1818
        editor: "Thomas Taylor / Vittorio De Falco"

  - repo: theodosius
    author: Theodosius of Bithynia
    dates: "c. 160–100 BCE"
    era: Classical & Late Antiquity
    priority: 2
    books:
      - edition: sphaerica
        title: "Sphaerica (Books I–III)"
        year: 1927
        editor: "J. L. Heiberg / Paul Ver Eecke"

  - repo: aristarchus
    author: Aristarchus of Samos
    dates: "c. 310–230 BCE"
    era: Classical & Late Antiquity
    priority: 1
    books:
      - edition: sizes_and_distances
        title: "On the Sizes and Distances of the Sun and Moon"
        year: 1913
        editor: "Sir Thomas Little Heath (Oxford: Clarendon Press)"

  - repo: serenus
    author: Serenus of Antinoupolis
    dates: "c. 300–360 CE"
    era: Classical & Late Antiquity
    priority: 2
    books:
      - edition: section_of_cylinder_and_cone
        title: "On the Section of a Cylinder and On the Section of a Cone"
        year: 1896
        editor: "J. L. Heiberg (Teubner) / Edmond Halley (1710)"

  - repo: diophantus
    author: Diophantus of Alexandria
    dates: "fl. c. 250 CE"
    era: Classical & Late Antiquity
    priority: 1
    books:
      - edition: arithmetica
        title: "Arithmetica & On Polygonal Numbers"
        year: 1910
        editor: "Sir Thomas Little Heath (Cambridge University Press, 2nd ed.) / Paul Tannery (1893)"

  - repo: boethius
    author: Anicius Manlius Severinus Boethius
    dates: "c. 480–524 CE"
    era: Classical & Late Antiquity
    priority: 1
    books:
      - edition: de_institutione_arithmetica
        title: "De Institutione Arithmetica"
        year: 1867
        editor: "Gottfried Friedlein (Teubner)"
      - edition: de_institutione_musica
        title: "De Institutione Musica"
        year: 1867
        editor: "Gottfried Friedlein (Teubner)"

  # III. Islamic Golden Age
  - repo: alhazen
    author: Ibn al-Haytham (Alhazen)
    dates: "c. 965–1040 CE"
    era: Islamic Golden Age
    priority: 1
    books:
      - edition: opticae_thesaurus
        title: "Opticae Thesaurus (Kitab al-Manazir)"
        year: 1572
        editor: "Friedrich Risner (Basel)"
      - edition: on_known_things
        title: "Fi al-Ma'lumat (On Known Things)"
        year: 1900

  - repo: khayyam
    author: Omar Khayyam
    dates: "1048–1131 CE"
    era: Islamic Golden Age
    priority: 1
