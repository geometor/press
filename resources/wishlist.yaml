        year: 1528
        editor: "K. Lange & F. Fuhse (1893, Dürers Schriftlicher Nachlass) / W. M. Conway (1889)"
      - edition: menschlicher_proportion
        title: "Vier Bücher von menschlicher Proportion"
        year: 1528

  - repo: alberti
