    title: "Fontes Geometrici"
    subtitle: "Classical, Medieval & Renaissance Geometric Treatises"
    accent: "#b8860b"  # Warm ochre / gold leaf
  noetica:
    title: "Bibliotheca Noetica"
    subtitle: "Philosophical, Epistemological & Axiomatic Foundations"
    accent: "#8b3a3a"  # Venetian rubric red
  synthesis:
    title: "Synthesis & Constructio"
    subtitle: "Modern Synthetic, Projective & Computable Geometry"
    accent: "#2b5b84"  # Prussian / blueprint blue
  natura:
    title: "Morphogenesis & Natura"
    subtitle: "Living Geometry, Proportion & Wave-Field Cosmogony"
    accent: "#2e6f40"  # Botanical viridian
  architectura:
    title: "Instrumenta & Machina"
    subtitle: "Symbolic Engines, Formal Grammars & Reasoning Systems"
    accent: "#5a4fcf"  # Spectral violet

